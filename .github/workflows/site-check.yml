name: Site check

on: push

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the GitHub Pages builder
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Fail on template leftovers
        run: |
          if grep -rIlE 'Red Brick|Blog Post number|personal description|Your Sidebar Name|github\.io//' _site; then
            echo "::error::Template leftovers found in the files listed above"
            exit 1
          fi

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Check internal links and images
        run: |
          gem install html-proofer -v '~> 5.0'
          htmlproofer ./_site \
            --disable-external \
            --allow-missing-href \
            --swap-urls '^https\://kevin-zx-liu\.github\.io:'

      - name: Upload built site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
